[workspace]
members = [
    ".",
    "remdb-macros",
    "crates/remdb-c-api",
    "crates/remdb-alloc",
    "crates/remdb-platform-posix",
    "crates/remdb-platform-baremetal",
]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[package]
name = "remdb"
version = "0.2.9"
edition = "2021"
authors = ["remdb contributors"]
description = "嵌入式内存数据库"
license = "MIT"
documentation = "https://docs.rs/remdb"
homepage = "https://github.com/bobjia/remdb"
repository = "https://github.com/bobjia/remdb"

[lib]
name = "remdb"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib", "cdylib"]

[lints]
workspace = true



[dependencies]
parking_lot = { version = "0.12", default-features = false }
rand = { version = "0.8.5", optional = true }
remdb-macros = { path = "./remdb-macros", version = "0.2.9" }
socket2 = { version = "0.5.5", optional = true }

[dev-dependencies]
criterion = "0.5"
serial_test = "3.0.0"

[[bench]]
name = "database"
harness = false

[features]
default = ["std", "ha", "pubsub"]
std = ["rand", "socket2"]
debug = []
c-api = []
pubsub = ["std"]
ha = ["pubsub"]

[profile.release]
opt-level = "z"          # 优化大小
lto = true               # 链接时优化
codegen-units = 1        # 单代码生成单元，优化更好
panic = "abort"          # 崩溃时直接终止

[profile.dev]
opt-level = 1            # 开发模式也有一些优化
panic = "unwind"         # 开发模式也使用unwind，以便调试

[profile.test]
panic = "unwind"         # 测试模式使用unwind，以便生成测试回溯
test-threads = 1

[build-dependencies]
cc = "1.0"

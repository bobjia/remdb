[workspace]
members = [
    ".",
    "remdb-macros",
]

[package]
name = "remdb"
version = "0.3.1"
edition = "2021"
authors = ["remdb contributors"]
description = "嵌入式内存数据库"
license = "MIT"
documentation = "https://docs.rs/remdb"
homepage = "https://github.com/bobjia/remdb"
repository = "https://github.com/bobjia/remdb"

[lib]
name = "remdb"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib", "cdylib"]



[dependencies]
rand = { version = "0.8.5", optional = true }
remdb-macros = { path = "./remdb-macros", version = "0.3.1" }
socket2 = { version = "0.5.5", optional = true }
lazy_static = "1.4.0"
tracing-core = { version = "0.1", optional = true }
heapless = { version = "0.8", optional = true }
regex = { version = "1.10.0", optional = true }
lz4 = { version = "1.24", optional = true }
zstd = { version = "0.13", optional = true }
ort = { version = "2.0.0-rc.11", optional = true, default-features = false, features = ["download-binaries", "ndarray", "std", "tls-native", "copy-dylibs"] }
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
tokio = { version = "1.0", features = ["rt", "sync", "time"], optional = true }
reqwest = { version = "0.12", features = ["stream"], optional = true }
sha2 = { version = "0.10", optional = true }
futures = { version = "0.3", optional = true }
ndarray = { version = "0.15", optional = true }
ureq = { version = "2.9", optional = true }

[dependencies.tracing]
version = "0.1"
optional = true
features = ["attributes"]

[dependencies.tracing-subscriber]
version = "0.3"
optional = true
features = ["fmt", "env-filter"]

[dependencies.tracing-appender]
version = "0.2"
optional = true

[dev-dependencies]
criterion = "0.5"
serial_test = "3.0.0"

# Binary targets
[[bin]]
name = "model_worker"
path = "src/bin/model_worker.rs"
required-features = ["model-runtime"]

[[bench]]
name = "database"
harness = false


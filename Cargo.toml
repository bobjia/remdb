[features]
default = ["std", "posix", "ha", "pubsub", "c-api", "log"]
std = ["rand", "socket2", "tracing", "tracing-subscriber", "tracing-appender", "regex"]
posix = ["std"]
baremetal = ["log", "tracing-core", "heapless"]
debug = []
c-api = []
pubsub = ["std"]
ha = ["pubsub"]
log = []
wal-compression-lz4 = ["lz4"]
wal-compression-zstd = ["zstd"]
model-runtime = ["ort", "serde", "bincode", "tokio", "ndarray"]
model-download = ["reqwest", "sha2", "std", "futures", "ureq"]

[profile.release]
opt-level = "z"          # 优化大小
lto = true               # 链接时优化
codegen-units = 1        # 单代码生成单元，优化更好
panic = "abort"          # 崩溃时直接终止

[profile.dev]
opt-level = 1            # 开发模式也有一些优化
panic = "unwind"         # 开发模式也使用unwind，以便调试

[build-dependencies]
cc = "1.0"

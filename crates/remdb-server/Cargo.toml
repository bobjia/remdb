[package]
name = "remdb-server"
version = "0.1.0"
edition = "2021"
description = "Lean TCP query server for remdb (protobuf, zero-copy)"

[dependencies]
remdb = { path = "../..", default-features = false, features = ["std"] }
remdb-platform-posix = { path = "../remdb-platform-posix" }
prost = "0.12"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "zero_copy_server"
harness = false